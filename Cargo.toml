[package]
name = "sqlx-named-bind"
version = "0.1.0"
edition = "2021"
authors = ["Akira Kano <akira.kano1101@gmail.com>"]
description = "Named parameter binding for SQLx with HRTB pattern, avoiding self-referential issues"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kano1101/sqlx-named-bind"
documentation = "https://docs.rs/sqlx-named-bind"
homepage = "https://github.com/kano1101/sqlx-named-bind"
keywords = ["sqlx", "database", "mysql", "named-parameters", "query-builder"]
categories = ["database"]
readme = "README.md"

[features]
default = ["sqlite"]
mysql = ["sqlx/mysql"]
postgres = ["sqlx/postgres"]
sqlite = ["sqlx/sqlite"]
any = ["sqlx/any"]
mssql = ["dep:sqlx-mssql-rs"]

[dependencies]
sqlx = { version = "0.9", default-features = false }
sqlx-mssql-rs = { version = "0.1.1", default-features = false, features = ["offline"], optional = true }
regex = "1.11"
thiserror = "2.0"

[dev-dependencies]
tokio = { version = "1.42", features = ["full"] }
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio", "macros"] }

[[example]]
name = "basic"
path = "examples/basic.rs"
required-features = ["sqlite"]

[[example]]
name = "transaction"
path = "examples/transaction.rs"
required-features = ["sqlite"]
